name: m3-core-rs CI

# Why this exists: release.yml is triggered ONLY by a `v*` tag push, so until
# now nothing ran cargo check / clippy / test on ordinary commits. A compile
# error on a platform the author did not build on — trivially easy in this
# repo, which is dense with `#[cfg(unix)]` / `#[cfg(windows)]` arms — was not
# discovered until a release was already tagged and its wheel jobs failed.
# That is the worst possible time to find it: the tag exists, the release is
# half-published, and the fix needs a new tag.
#
# This runs the cheap checks on every push/PR, on all three OSes, so a
# platform-gated mistake fails in minutes on the commit that caused it.
# Deliberately does NOT build wheels (that is release.yml's job, and the CUDA
# wheels are ~1 GB) — `cargo check` on the default feature set catches the
# class of bug this is for.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # m3-core-py builds pyo3 with `extension-module`, which deliberately does NOT
  # link libpython: a Python extension resolves _PyExc_* / _Py* at import time
  # from the host interpreter. Linux and Windows tolerate the resulting
  # undefined symbols in a cdylib; macOS's linker rejects them outright, so a
  # bare `cargo test` fails at link with "Undefined symbols for architecture
  # arm64: _PyExc_AttributeError, ...".
  #
  # release.yml never hits this because it builds through maturin, which injects
  # these link args itself. This CI calls cargo directly, so it must supply
  # them. `dynamic_lookup` is the same mechanism maturin uses — defer the
  # symbols to load time rather than requiring them at link time.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  check:
    name: Check + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Install the Rust toolchain
      run: rustup toolchain install stable --profile minimal --component clippy --no-self-update

    - name: Cache cargo registry + target
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.0.2
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    # The whole workspace, default features. This is the gate that catches a
    # cfg-gated arm that only compiles on the author's platform.
    # macOS only: see the MACOSX_DEPLOYMENT_TARGET note above. Setting this as
    # a step (not a job-level env) keeps Linux/Windows link lines untouched.
    - name: Allow undefined Python symbols (macOS pyo3 extension-module)
      if: runner.os == 'macOS'
      run: echo 'RUSTFLAGS=-C link-arg=-undefined -C link-arg=dynamic_lookup' >> "$GITHUB_ENV"

    - name: cargo check (workspace)
      run: cargo check --workspace --all-targets

    # m3-embed-server's real behaviour lives behind the `embedded` feature —
    # including the platform-split shutdown_signal — so the default-feature
    # check above does not compile it. Check it explicitly.
    - name: cargo check (m3-embed-server, embedded feature)
      run: cargo check -p m3-embed-server --features embedded --all-targets

    - name: cargo test (workspace)
      run: cargo test --workspace

    - name: cargo test (m3-embed-server, embedded feature)
      run: cargo test -p m3-embed-server --features embedded

    # `-D warnings`: the workspace is clippy-clean, so any NEW warning fails the
    # build rather than joining a backlog nobody reads. The 14 pre-existing
    # warnings this gate used to tolerate were cleared in the same change that
    # flipped it, so this has never been red.
    - name: cargo clippy (workspace)
      run: cargo clippy --workspace --all-targets -- -D warnings

    # The embedded feature compiles a different set of cfg arms (notably the
    # platform-split shutdown_signal), so it needs its own lint pass — a clean
    # default-feature run says nothing about it.
    - name: cargo clippy (m3-embed-server, embedded feature)
      run: cargo clippy -p m3-embed-server --features embedded --all-targets -- -D warnings
