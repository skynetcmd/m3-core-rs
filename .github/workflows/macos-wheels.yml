name: Build macOS Wheels

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  macos-wheels:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CPU Wheel
        run: |
          cd crates/m3-core-py
          maturin build --release --features embedded --interpreter python${{ matrix.python-version }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Build Metal Wheel
        run: |
          cd crates/m3-core-py
          maturin build --release --features embedded-metal --interpreter python${{ matrix.python-version }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Build Embed Server Binary
        run: cargo build -p m3-embed-server --release --features embedded

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-wheels-py${{ matrix.python-version }}
          path: |
            target/wheels/*.whl
            target/release/m3-embed-server
