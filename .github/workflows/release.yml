# Release workflow — build the m3-core-rs backend wheel matrix and publish.
#
# m3-core-rs ships one Rust source but is published as several differently
# named PyPI packages, one per (OS, backend) pair, all installing the same
# `m3_core_rs` import module. The m3 setup wizard detects (os, backend) and
# installs the matching package. See crates/m3-core-py/build_wheel.py — the
# single source of truth for the (os, backend) -> package-name + features
# mapping; this workflow calls it so the two can never drift.
#
#   windows: cpu, cuda, vulkan      linux: cpu, cuda, vulkan      macos: metal
#
# GitHub-hosted runners have no GPU, but that's fine: we BUILD the backends
# (nvcc compiles CUDA kernels; glslc compiles Vulkan shaders) — we never run
# them in CI. Building needs the toolkits, not a device.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API tokens stored. Each
# of the 7 PyPI projects must have this repo + workflow registered as a
# trusted publisher first (https://docs.pypi.org/trusted-publishers/). Until
# that's set up, run with workflow_dispatch + publish=false to only build and
# upload wheels as workflow artifacts.

name: release

on:
  push:
    tags:
      - "v*"            # e.g. v2026.05.30
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (requires trusted publishers configured)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os_tok }}-${{ matrix.backend }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──────────────────────────────────────────────────────
          - { runner: windows-latest, os_tok: windows, backend: cpu }
          - { runner: windows-latest, os_tok: windows, backend: cuda }
          - { runner: windows-latest, os_tok: windows, backend: vulkan }
          # ── Linux (manylinux via maturin container handled per-step) ──────
          - { runner: ubuntu-latest, os_tok: linux, backend: cpu }
          - { runner: ubuntu-latest, os_tok: linux, backend: cuda }
          - { runner: ubuntu-latest, os_tok: linux, backend: vulkan }
          # ── macOS Apple Silicon (Metal) ──────────────────────────────────
          - { runner: macos-14, os_tok: macos, backend: metal }
    steps:
      - uses: actions/checkout@v4

      # Install ALL supported CPython versions so one build job emits a wheel
      # per (Python, this-job's-backend). m3-memory declares
      # requires-python >= 3.11, so we cover 3.11–3.14; pip then auto-selects
      # the matching wheel by the cpXY tag. Without the full set, only the
      # last interpreter's wheel ships and 3.11–3.13 users fall back to a
      # slow source build.
      - name: Set up Python (3.11–3.14)
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os_tok }}-${{ matrix.backend }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install maturin
        run: pip install "maturin>=1.7,<2.0"

      # ── Backend toolchains ───────────────────────────────────────────────
      - name: Install CUDA toolkit (cuda backend)
        if: matrix.backend == 'cuda'
        # CUDA 13.2.0 links were only added in the action's v0.2.32; v0.2.19
        # didn't know the version and failed with "Version not available".
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "13.2.0"
          # build-only: we need nvcc + cublas headers/libs, not a driver.
          method: network

      # Linux: the prebuilt-SDK action works and linux-vulkan is green — keep it.
      - name: Install Vulkan SDK (Linux vulkan backend)
        if: matrix.backend == 'vulkan' && runner.os == 'Linux'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.341.0
          cache: true

      # Windows needs BOTH SDK sources — neither alone is complete:
      #   - setup-vulkan-sdk builds Vulkan-Headers + Vulkan-Loader (gives the
      #     headers + vulkan-1.lib) but NOT glslc.
      #   - install-vulkan-sdk ships glslc (+ bin tools) but NOT the dev
      #     headers / import lib.
      # find_package(Vulkan) needs all three, and llama-cpp-sys-2 IGNORES
      # CMAKE_ARGS, so -D hint injection doesn't work — only a correctly-laid-out
      # VULKAN_SDK (read natively by FindVulkan) does. We run both, then the
      # merge step assembles one canonical SDK dir.
      - name: Build Vulkan headers+loader (Windows vulkan backend)
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.341.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Install prebuilt Vulkan SDK for glslc (Windows vulkan backend)
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.341.0
          cache: true

      # Assemble a single VULKAN_SDK with the layout FindVulkan expects:
      #   <root>/Include/vulkan/vulkan.h, <root>/Lib/vulkan-1.lib, <root>/Bin/glslc.exe
      # Source files are located by searching the whole workspace (both actions
      # extract somewhere under it), so we don't hard-code either action's layout.
      - name: Assemble merged Vulkan SDK (Windows vulkan backend)
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $glslc = Get-ChildItem $ws -Recurse -Filter glslc.exe     -ErrorAction SilentlyContinue | Select-Object -First 1
          $vklib = Get-ChildItem $ws -Recurse -Filter vulkan-1.lib  -ErrorAction SilentlyContinue | Select-Object -First 1
          $vkhdr = Get-ChildItem $ws -Recurse -Filter vulkan.h      -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match '[\\/]vulkan[\\/]vulkan\.h$' } | Select-Object -First 1
          Write-Host "glslc=$($glslc.FullName)"
          Write-Host "vulkan-1.lib=$($vklib.FullName)"
          Write-Host "vulkan.h=$($vkhdr.FullName)"
          if (-not ($glslc -and $vklib -and $vkhdr)) { Write-Error "missing a Vulkan component"; exit 1 }
          $root = Join-Path $ws 'vulkan-merged'
          New-Item -ItemType Directory -Force -Path "$root\Bin","$root\Lib","$root\Include" | Out-Null
          Copy-Item $glslc.FullName "$root\Bin\" -Force
          Copy-Item $vklib.FullName "$root\Lib\" -Force
          # Copy the WHOLE include root, not just vulkan/ — vulkan_core.h pulls in
          # sibling dirs like vk_video/ (vulkan_video_codec_*.h). $vkhdr is
          # <inc>/vulkan/vulkan.h, so its parent's parent is the include root.
          $incRoot = $vkhdr.Directory.Parent.FullName
          Copy-Item (Join-Path $incRoot '*') "$root\Include\" -Recurse -Force
          Write-Host "=== merged SDK tree ==="
          Get-ChildItem $root -Recurse | Select-Object -ExpandProperty FullName
          @(
            "VULKAN_SDK=$root"
            "Vulkan_ROOT=$root"
            "CMAKE_PREFIX_PATH=$root"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$root\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # llama.cpp's GPU builds use the Ninja generator + a C/C++ compiler and
      # bindgen (libclang). On Windows the VS generator hits a CMake-4.x +
      # MSBuild ExternalProject batch-label bug ("VCEnd") building
      # vulkan-shaders-gen — Ninja avoids it. Force Ninja on every GPU build.
      - name: Set up Ninja + LLVM (GPU builds)
        if: matrix.backend != 'cpu'
        uses: aminya/setup-cpp@v1
        with:
          ninja: true
          llvm: true

      - name: Force Ninja generator (GPU builds)
        if: matrix.backend != 'cpu'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      # Windows GPU builds use MSVC cl.exe — the proven path (see PUBLISHING.md:
      # "CMAKE_GENERATOR=Ninja inside a vcvars64 environment"). The VCEnd
      # ExternalProject bug is dodged by the Ninja GENERATOR (above), NOT by
      # changing the compiler. An earlier clang-cl detour caused a cascade of
      # flag-mismatch / Git-Bash path-mangling failures (/EHsc -> "C:/Program
      # Files/Git/EHsc"), so we use cl.exe, which cc-rs/CMake pick by default
      # on an MSVC target and which enables C++ exceptions by default.
      #
      # setup-cpp's `llvm: true` (needed for libclang.dll → bindgen) also points
      # CC/CXX at clang. Clear those so cc-rs falls back to cl.exe, but keep
      # LIBCLANG_PATH so bindgen still finds libclang.
      - name: Use MSVC cl.exe on Windows GPU builds
        if: runner.os == 'Windows' && matrix.backend != 'cpu'
        shell: bash
        run: |
          {
            echo "CC=cl"
            echo "CXX=cl"
            echo "CMAKE_C_COMPILER=cl"
            echo "CMAKE_CXX_COMPILER=cl"
          } >> "$GITHUB_ENV"

      # Activate the MSVC toolchain (vcvars64): puts cl.exe + the Windows SDK on
      # PATH for the Ninja build. Locally this is the "Developer Command Prompt";
      # on the runner ilammy/msvc-dev-cmd is the equivalent.
      - name: Set up MSVC dev environment (Windows GPU builds)
        if: runner.os == 'Windows' && matrix.backend != 'cpu'
        uses: ilammy/msvc-dev-cmd@v1

      # The build step runs under Git-Bash (shell: bash), which re-adds its
      # /usr/bin to PATH on every shell start — and /usr/bin holds a Unix `link`
      # that shadows MSVC's link.exe. Stripping PATH in a prior step is futile
      # (bash puts it back), so rustc links with Git's link.exe and dies on the
      # first build script ("/usr/bin/link: extra operand ...rcgu.o"). Instead,
      # pin cargo's MSVC linker to the ABSOLUTE path of the real link.exe — an
      # absolute linker path bypasses PATH resolution entirely. Resolve it here
      # in pwsh (where msvc-dev-cmd's PATH is correct) and export it.
      - name: Pin MSVC linker for Rust (Windows GPU builds)
        if: runner.os == 'Windows' && matrix.backend != 'cpu'
        shell: pwsh
        run: |
          $link = (Get-Command link.exe -All | Where-Object { $_.Source -notmatch '\\Git\\' } | Select-Object -First 1).Source
          if (-not $link) { Write-Error "MSVC link.exe not found on PATH"; exit 1 }
          Write-Host "Pinning MSVC linker: $link"
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Linux CUDA: nvcc-compiled .cu.o objects default to non-PIC, but they
      # link into a cdylib (the PyO3 extension), so rust-lld fails with
      # "relocation R_X86_64_PC32 cannot be used against symbol 'stderr';
      # recompile with -fPIC". Tell nvcc to pass -fPIC to the host compiler and
      # turn on position-independent code for llama.cpp's CMake build.
      - name: Force PIC for Linux CUDA build
        if: runner.os == 'Linux' && matrix.backend == 'cuda'
        shell: bash
        run: |
          {
            echo "CMAKE_CUDA_FLAGS=-Xcompiler -fPIC"
            echo "CMAKE_POSITION_INDEPENDENT_CODE=ON"
          } >> "$GITHUB_ENV"

      # Linux GPU builds additionally need the Vulkan loader headers / OpenMP
      # bits that the SDK action doesn't place system-wide.
      - name: Linux build deps
        if: matrix.os_tok == 'linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libclang-dev

      # ── Build the backend wheel via the canonical script ─────────────────
      # One wheel per (CPython 3.11–3.14, this job's backend). build_wheel.py
      # rewrites [project].name to m3-core-rs-<os>-<backend> and forwards the
      # interpreter list to maturin (everything after the literal `--`).
      # setup-python puts every requested version on PATH as pythonX.Y.
      #
      # NOTE: build_wheel.py runs maturin with cwd=crates/m3-core-py, so a
      # relative --out would land under the crate dir. Pass an ABSOLUTE path
      # ($GITHUB_WORKSPACE/dist) so wheels land in the repo-root dist/ that the
      # smoke-test, upload, and publish steps all read.
      # CUDA wheels link against the NVIDIA driver's libcuda.so.1, which is
      # NOT present on CI (no GPU) and must NOT be bundled — it's supplied by
      # the user's installed driver at runtime. auditwheel's DEFAULT repair
      # fails ("required library libcuda.so.1 could not be located"), so we
      # skip it during the maturin build; the next step re-tags the Linux CUDA
      # wheel to manylinux while EXCLUDING libcuda.so.1 (PyPI rejects the plain
      # linux_x86_64 tag that --auditwheel skip leaves). On Windows there is no
      # auditwheel, so skip is the correct final state there.
      # CPU/Vulkan/Metal wheels are repaired by maturin normally.
      - name: Build wheels (all Python versions)
        shell: bash
        run: |
          extra=""
          if [ "${{ matrix.backend }}" = "cuda" ]; then
            extra="--auditwheel skip"
          fi
          python crates/m3-core-py/build_wheel.py \
            --backend "${{ matrix.backend }}" \
            --os "${{ matrix.os_tok }}" \
            --out "$GITHUB_WORKSPACE/dist" \
            -- --interpreter python3.11 python3.12 python3.13 python3.14 $extra

      # Linux CUDA only: maturin left the wheels tagged linux_x86_64 (auditwheel
      # was skipped). PyPI rejects that tag. Re-tag to manylinux with auditwheel,
      # excluding libcuda.so.1 (the driver stub — stays an external runtime dep;
      # the .so links no other external CUDA libs, cuBLAS/cudart are static).
      # The repaired wheel replaces the linux_x86_64 one in dist/.
      - name: Repair Linux CUDA wheels to manylinux (exclude libcuda)
        if: runner.os == 'Linux' && matrix.backend == 'cuda'
        shell: bash
        run: |
          python -m pip install --upgrade auditwheel
          for whl in "$GITHUB_WORKSPACE"/dist/*-linux_x86_64.whl; do
            python -m auditwheel repair --exclude libcuda.so.1 \
              -w "$GITHUB_WORKSPACE/dist" "$whl"
            rm -f "$whl"   # drop the unacceptable linux_x86_64 wheel
          done
          ls -la "$GITHUB_WORKSPACE"/dist/*.whl

      # Import-smoke each CPU wheel on its own interpreter (runners have no GPU,
      # so only CPU wheels are runtime-tested; GPU wheels are import-verified
      # off-CI on a device — see WHEEL_BUILD_GUIDE.md). The CPU wheel is the
      # plain vector-ops build (no llama.cpp / no EmbeddedEmbedder by design),
      # so the smoke test must NOT assert EmbeddedEmbedder.
      # Run each per-version wheel on its matching interpreter. setup-python
      # exposes the non-default versions differently per OS: on Linux/macOS as
      # `pythonX.Y` on PATH, but on Windows there is no `python3.11.exe` — the
      # `py -X.Y` launcher is the reliable per-version selector. Pick the right
      # invocation by RUNNER_OS so the loop works on every runner.
      - name: Smoke-test CPU wheels
        if: matrix.backend == 'cpu'
        shell: bash
        run: |
          for v in 3.11 3.12 3.13 3.14; do
            whl=$(ls "$GITHUB_WORKSPACE"/dist/*-cp${v/./}-*.whl)
            if [ -z "$whl" ]; then
              echo "::error::no wheel matching cp${v/./} in dist/"; exit 1
            fi
            if [ "$RUNNER_OS" = "Windows" ]; then
              py="py -$v"
            else
              py="python$v"
            fi
            $py -m pip install --force-reinstall "$whl"
            $py -c "import m3_core_rs as m; assert abs(m.cosine([1.0,0,0],[1.0,0,0]) - 1.0) < 1e-6; assert hasattr(m,'compile_fts_query'); print('smoke OK py$v:', m.embed_backend_label())"
          done

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os_tok }}-${{ matrix.backend }}
          path: dist/*.whl
          if-no-files-found: error

  # One publish job per distinct PyPI project. Trusted Publishing maps a
  # GitHub (repo, workflow, environment) to a single PyPI project, so each
  # package publishes from its own environment. They all pull from the same
  # build artifacts.
  publish:
    name: publish ${{ matrix.os_tok }}-${{ matrix.backend }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os_tok: windows, backend: cpu }
          - { os_tok: windows, backend: cuda }
          - { os_tok: windows, backend: vulkan }
          - { os_tok: linux, backend: cpu }
          - { os_tok: linux, backend: cuda }
          - { os_tok: linux, backend: vulkan }
          - { os_tok: macos, backend: metal }
    environment:
      name: pypi-${{ matrix.os_tok }}-${{ matrix.backend }}
      url: https://pypi.org/p/m3-core-rs-${{ matrix.os_tok }}-${{ matrix.backend }}
    permissions:
      id-token: write     # OIDC token for PyPI Trusted Publishing
    steps:
      - name: Download this package's wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.os_tok }}-${{ matrix.backend }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # No password/token: Trusted Publishing via the id-token above.
          # Set skip-existing so a re-run of an already-published version is
          # a no-op rather than a hard failure.
          skip-existing: true
