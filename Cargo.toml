[workspace]
resolver = "2"
members = [
    "crates/m3-error",
    "crates/m3-hash",
    "crates/m3-vector",
    "crates/m3-dispatcher",
    "crates/m3-embed-llamacpp",
    "crates/m3-embed-server",
    "crates/m3-ner-ort",
    "crates/m3-redact",
    "crates/m3-rank",
    "crates/m3-route",
    "crates/m3-graph",
    "crates/m3-fts",
    "crates/m3-governor",
    "crates/m3-ingest",
    "crates/m3-core-py",
]

[workspace.package]
version = "3.6.22"
edition = "2021"
license = "MIT"
repository = "https://github.com/skynetcmd/m3-memory-rs"
rust-version = "1.94"

[workspace.dependencies]
m3-error = { path = "crates/m3-error" }
m3-hash = { path = "crates/m3-hash" }
m3-vector = { path = "crates/m3-vector" }
m3-dispatcher = { path = "crates/m3-dispatcher" }
m3-embed-llamacpp = { path = "crates/m3-embed-llamacpp" }
m3-ner-ort = { path = "crates/m3-ner-ort" }
m3-redact = { path = "crates/m3-redact" }
m3-rank = { path = "crates/m3-rank" }
m3-route = { path = "crates/m3-route" }
m3-graph = { path = "crates/m3-graph" }
m3-fts = { path = "crates/m3-fts" }
m3-governor = { path = "crates/m3-governor" }
m3-ingest = { path = "crates/m3-ingest" }

[profile.release]
lto = "thin"
codegen-units = 1
