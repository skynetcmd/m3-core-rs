[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "m3-core-rs"
description = "PyO3-backed Rust core for m3-memory (Project Oxidation)."
# Tracks m3-memory's floor, which this crate exists to serve: m3-memory raised
# requires-python to >=3.12 on 2026-09-13 (e43f0a1b) and its classifiers list
# 3.12/3.13/3.14. The previous ">=3.9" was the untouched value from the first
# Oxidation commit and was never true in practice: these wheels are built
# per-interpreter (no abi3), so a 3.9 or 3.10 wheel has never existed.
#
# This floor IS enforced on our real install path even though nothing resolves
# from an index. m3-memory's rust_core_install.py downloads a Release asset and
# runs `pip install --force-reinstall --no-deps <path>.whl`; pip still reads
# Requires-Python from the wheel's METADATA and refuses with "requires a
# different Python" (verified 2026-09-16). Declaring the truth turns a confusing
# ImportError or source-build attempt into that clear message.
#
# FLOOR RESTORED to >=3.12 (2026-10-01). The one-release cp311 courtesy set
# shipped in v2026.9.20 — verified: that release carries 7 cp311 wheels, one per
# backend — so the condition its own note gave ("restore >=3.12 once the cp311
# set has shipped") is met. The temporary >=3.11 also had to advertise itself on
# the cp312-315 wheels, because the floor is global to the build
# (build_wheel.py rewrites [project].name only — there is no per-wheel
# requires-python knob); restoring it stops those wheels claiming support m3
# itself does not offer.
#
# ONE-TIME EXCEPTION, now closed — the floor only moves FORWARD from here
# (>=3.12, then >=3.13, then >=3.14 as those become the supported set). Do not
# lower it again for another interpreter; cp311 was a single farewell build.
requires-python = ">=3.12"
license = { text = "MIT" }
dynamic = ["version"]

[tool.maturin]
module-name = "m3_core_rs"
features = ["pyo3/extension-module"]
# Mixed Rust/Python layout: `python/m3_core_rs/__init__.py` runs first and
# registers CUDA/Vulkan DLL search directories via `os.add_dll_directory`
# before the compiled `.pyd` is loaded. Required on Windows for any GPU
# feature build because Python ignores `PATH` for extension DLL resolution
# since 3.8. See the docstring in that __init__.py.
python-source = "python"
# Bundle the shared-embedder binary that build_wheel.py stages into the package
# dir at build time. It is NOT git-tracked (generated per-build with the wheel's
# backend), so it must be listed explicitly or maturin would omit it — the exact
# regression that silently shipped binary-less wheels. Path is relative to
# python-source. See build_wheel.py::_staged_embed_server.
#
# The PDB is listed for the same reason and is easy to get wrong twice over:
# (1) it is gitignored like the binary, so maturin omits it unless named here;
# (2) its name is NOT the exe's. Cargo names the binary from the [[bin]] target
#     (`m3-embed-server.exe`, hyphens); MSVC names the PDB from the crate, which
#     Rust normalises to underscores (`m3_embed_server.pdb`).
# Without it a crash dump cannot be attributed to our frames: a debugger matches
# on the CODEVIEW GUID embedded in the PE, so a PDB from any other build is
# rejected -- or, if forced, yields a plausible WRONG stack under the same
# filename. Observed 2026-09-16 (deployed GUID 25E9D9EF-..., only PDB on disk
# 5AA032C4-...). Windows-only; absent elsewhere and simply not matched.
include = [
  { path = "m3_core_rs/m3-embed-server", format = "wheel" },
  { path = "m3_core_rs/m3-embed-server.exe", format = "wheel" },
  { path = "m3_core_rs/m3_embed_server.pdb", format = "wheel" },
]
