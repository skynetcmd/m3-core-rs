[package]
name = "m3-dispatchd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Per-user doorbell for m3 agent mail: coalesced, paced wake-ups over local IPC. No SQL, no cryptography."

[dependencies]
axum = "0.7"
hyper = { version = "1", features = ["server", "client", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "m3-dispatchd"
path = "src/main.rs"

[[bin]]
name = "m3-wait"
path = "src/bin/m3-wait.rs"
