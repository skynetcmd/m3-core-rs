[package]
name = "m3-embed-llamacpp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "llama.cpp embedding backend for m3-dispatcher."

[features]
default = []
# Real llama-cpp-rs FFI backend. Enabling this cmake-builds llama.cpp from
# source (CPU-only here) via llama-cpp-sys-2. The default build ships the
# HTTP backend only and pulls no llama.cpp dependency at all.
embedded = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2", "dep:crossbeam-channel"]

# Wave 9.0 — GPU backends. Mutually exclusive: pick exactly one per build.
# Each enables `embedded` (additive features) + the corresponding upstream
# llama-cpp-2 backend feature. Confirmed against llama-cpp-2 0.1.146's
# Cargo.toml: feature names are `cuda`, `vulkan`, `metal` (each forwards to
# `llama-cpp-sys-2/<name>`). Mutual exclusivity is enforced at compile time
# in src/lib.rs via `compile_error!`. Actual GPU builds are wired in waves
# 9.2 (CUDA) and 9.6 (Vulkan/Metal); this wave only stages the feature
# surface.
embedded-cuda   = ["embedded", "llama-cpp-2/cuda"]
embedded-vulkan = ["embedded", "llama-cpp-2/vulkan"]
embedded-metal  = ["embedded", "llama-cpp-2/metal"]

[dependencies]
m3-error = { workspace = true }
m3-dispatcher = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
# Only compiled when the `embedded` feature is on. CPU-only: no cuda/metal/etc.
llama-cpp-2 = { version = "0.1.146", optional = true, default-features = false }
# Wave-3 fix #1: needed for the `LLAMA_FLASH_ATTN_TYPE_ENABLED` enum constant
# passed to `LlamaContextParams::with_flash_attention_policy`. The llama-cpp-2
# crate does not re-export `llama_cpp_sys_2`, so we depend on it directly.
# Pinned to the same 0.1.146 patch as llama-cpp-2 to share the same C build.
llama-cpp-sys-2 = { version = "0.1.146", optional = true, default-features = false }
# Wave-3 fix #4: lock-free MPMC channel so the worker pool's job dispatch is
# not serialized through a `Mutex<Receiver>`. Used unconditionally inside the
# `embedded` module, which is itself feature-gated.
crossbeam-channel = { version = "0.5", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
