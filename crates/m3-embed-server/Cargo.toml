[package]
name = "m3-embed-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenAI-compatible HTTP embedding server backed by m3-embed-llamacpp's in-process llama.cpp backend."

[features]
default = []
# CPU embed backend — required. Forwards to m3-embed-llamacpp/embedded.
# Future GPU variants (cuda/vulkan/metal) can be added here later, but the
# 8082 fallback role is explicitly CPU-only.
embedded = ["m3-embed-llamacpp/embedded"]

[dependencies]
m3-embed-llamacpp = { workspace = true, features = [] }
m3-dispatcher = { workspace = true }
m3-error = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tracing-log = "0.2"
anyhow = "1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[[bin]]
name = "m3-embed-server"
path = "src/main.rs"
