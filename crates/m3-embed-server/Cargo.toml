[package]
name = "m3-embed-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenAI-compatible HTTP embedding server backed by m3-embed-llamacpp's in-process llama.cpp backend."

[features]
default = []
# CPU embed backend — required. Forwards to m3-embed-llamacpp/embedded.
embedded = ["m3-embed-llamacpp/embedded"]
# GPU backends. Each inherits `embedded` so the base in-process backend is
# always present, then adds the GPU acceleration — mirroring m3-core-py's
# feature forwarding so the server binary bundled into a `-<backend>` wheel is
# built with the SAME backend as that wheel's `.pyd` (a cuda wheel ships a cuda
# server, etc.). Without these, `build_wheel.py` could only build a CPU server
# for a GPU wheel — a silent backend mismatch.
embedded-cuda   = ["embedded", "m3-embed-llamacpp/embedded-cuda"]
embedded-vulkan = ["embedded", "m3-embed-llamacpp/embedded-vulkan"]
# Metal GPU backend (macOS).
embedded-metal  = ["embedded", "m3-embed-llamacpp/embedded-metal"]
# Link AWS-LC's FIPS module for TLS and the token digest (needs CMake and Go to
# build). Without it TLS still uses only approved algorithms, but
# `crypto.fips_strict` refuses to serve TLS. See src/security.rs.
fips = ["rustls/fips", "aws-lc-rs/fips"]

[dependencies]
m3-embed-llamacpp = { workspace = true, features = [] }
m3-dispatcher = { workspace = true }
m3-error = { workspace = true }
m3-resilience = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "net", "time"] }
# Transport security (src/security.rs): rustls on aws-lc-rs, never ring.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
aws-lc-rs = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "service", "http1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tracing-log = "0.2"
anyhow = "1"
toml = "0.8"
# `secure` edits config.toml in place, keeping the operator's comments.
toml_edit = "0.22"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util"] }

[[bin]]
name = "m3-embed-server"
path = "src/main.rs"
