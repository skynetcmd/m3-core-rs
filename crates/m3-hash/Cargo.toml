[package]
name = "m3-hash"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "FIPS-preserving content hashing for the m3-core-rs workspace."

[features]
default = []
# Opt-in, non-FIPS, dev-only fast path. Production wheels never set this.
non-fips-perf = ["dep:sha2"]

[dependencies]
m3-error = { workspace = true }
ring = "0.17"
log = "0.4"
sha2 = { version = "0.10", optional = true }
