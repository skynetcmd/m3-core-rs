[package]
name = "m3-hash"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Content hashing (dedup and change-detection keys) for the m3-core-rs workspace."

[features]
default = []
# Opt-in, dev-only fast path (sha2). Production wheels never set this. The name
# is historical: neither provider is a validated module, and content keys sit
# outside m3's FIPS boundary.
non-fips-perf = ["dep:sha2"]

[dependencies]
m3-error = { workspace = true }
ring = "0.17"
log = "0.4"
sha2 = { version = "0.10", optional = true }
