[package]
name = "m3-vector"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SIMD cosine similarity and MMR reranking."

[features]
default = []

[dependencies]
m3-error = { workspace = true }
bytemuck = "1"
rayon = "1"
wide = "0.7"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
rand = "0.8"

[[bench]]
name = "vector_bench"
harness = false
