# Trivy secret-scanner config for m3-core-rs.
#
# Trivy's secret scanner auto-loads `trivy-secret.yaml` from the scan root. The
# m3-redact crate is a secret-detection/scrubbing library, so its source,
# tests, and benchmarks legitimately embed synthetic secret-shaped fixture
# strings (fake GitHub PATs, GCP keys, JWTs) as INPUT to the scrubber under
# test — never real credentials. Without an allow-rule, trivy reports them as
# Critical leaks on every scan.
#
# Path-scoped allow-rule (NOT a blanket rule disable — a real secret leaked
# anywhere ELSE still fails): only the redaction crate's files are exempt.
allow-rules:
  - id: m3-redact-fixtures
    description: >-
      Synthetic secret-shaped fixtures in the m3-redact crate (the redaction
      library under test); not real credentials.
    path: .*m3-redact/(src|tests|benches)/.*\.rs$
